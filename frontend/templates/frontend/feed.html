<!DOCTYPE html>
<html>
<head>
    <title>Feed</title>

    <style>
        body {
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        .feed-container {
            width: 600px;
            margin: 40px auto;
        }

        .post-card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .post-author {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .post-time {
            color: gray;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .like-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .like-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="feed-container">
    <h2>Global Feed</h2>
    <div id="feed-posts"></div>
</div>

<script>

function getCSRFToken() {
  return document.cookie
    .split("; ")
    .find(row => row.startsWith("csrftoken="))
    ?.split("=")[1];
}

function loadFeed() {
  fetch("/api/posts/", {
    credentials: "same-origin"
  })
  .then(res => res.json())
  .then(data => renderFeed(data.results));
}

function renderFeed(posts) {
  const container = document.getElementById("feed-posts");
  container.innerHTML = "";

  posts.forEach(post => {
    const div = document.createElement("div");
    div.classList.add("post-card");

    div.innerHTML = `
      <div class="post-author">${post.author_username}</div>
      <div class="post-time">${new Date(post.created_at).toLocaleString()}</div>
      <p>${post.content}</p>

      <strong>Likes: <span class="like-count">${post.like_count}</span></strong>
      <br><br>

      <button class="like-btn"
        data-id="${post.id}"
        data-liked="${post.liked_by_me}">
        ${post.liked_by_me ? "Unlike" : "Like"}
      </button>

      ${post.author === CURRENT_USER_ID ? `
        <br><br>
        <button class="edit-btn" data-id="${post.id}">
          Edit
        </button>

        <button class="delete-btn" data-id="${post.id}">
          Delete
        </button>
      ` : ""}
    `;

    container.appendChild(div);
  });

  attachLikeHandlers();
  attachDeleteHandlers();
  attachEditHandlers();   
}
function attachLikeHandlers() {
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const postId = btn.dataset.id;
      const liked = btn.dataset.liked === "true";

      const method = liked ? "DELETE" : "POST";
      const url = liked
        ? `/api/posts/${postId}/unlike/`
        : `/api/posts/${postId}/like/`;

      fetch(url, {
        method,
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        let countEl = btn.parentElement.querySelector(".like-count");
        let count = parseInt(countEl.innerText);

        if (liked) {
          count--;
          btn.innerText = "Like";
          btn.dataset.liked = "false";
        } else {
          count++;
          btn.innerText = "Unlike";
          btn.dataset.liked = "true";
        }

        countEl.innerText = count;
      });
    });
  });
}

let CURRENT_USER_ID = null;

fetch("/api/me/", {
  credentials: "same-origin"
})
.then(res => res.json())
.then(data => {
  CURRENT_USER_ID = data.id;
  loadFeed();
});


function attachDeleteHandlers() {
  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", () => {

      const postId = btn.dataset.id;

      fetch(`/api/posts/${postId}/`, {
        method: "DELETE",
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        btn.closest(".post-card").remove();
      });

    });
  });
}

function attachEditHandlers() {
  document.querySelectorAll(".edit-btn").forEach(btn => {

    btn.addEventListener("click", () => {

      const card = btn.closest(".post-card");
      const contentEl = card.querySelector("p");

      const originalText = contentEl.innerText;

      contentEl.innerHTML = `
        <textarea class="edit-area">${originalText}</textarea>
        <br>
        <button class="save-btn">Save</button>
      `;

      btn.style.display = "none";

      card.querySelector(".save-btn")
        .addEventListener("click", () => {

          const newContent =
            card.querySelector(".edit-area").value;

          const postId = btn.dataset.id;

          fetch(`/api/posts/${postId}/`, {
            method: "PATCH",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({ content: newContent })
          })
          .then(res => res.json())
          .then(updated => {

            contentEl.innerHTML = updated.content;
            btn.style.display = "inline";

          });

        });

    });

  });
}


</script>

</body>
</html>
