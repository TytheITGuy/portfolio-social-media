<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>
<h1 id="username"></h1>
<p id="bio"></p>

<div id="posts">
    <h2>Posts</h2>
    <div id="posts-container"></div>
</div>


<script>
  const username = "{{ username }}";

  fetch(`/api/profiles/${username}/`)
    .then(response => {
      if (!response.ok) {
        throw new Error("Profile not found");
      }
      return response.json();
    })
    .then(data => {
    document.getElementById("username").innerText = data.username;
    document.getElementById("bio").innerText = data.bio || "No bio yet";

    loadPosts(data.username);
})
    .catch(error => {
      document.body.innerHTML = "<h2>Profile not found</h2>";
    });


function loadPosts(username) {
  fetch(`/api/posts/?username=${username}`, {
    credentials: "same-origin"
  })
    .then(response => {
      if (!response.ok) {
        throw new Error("Posts failed to load");
      }
      return response.json();
    })
    .then(data => {
      renderPosts(data.results);
    })
    .catch(err => {
      console.log(err);
    });
}

function renderPosts(posts) {
  const container = document.getElementById("posts-container");
  container.innerHTML = "";

  posts.forEach(post => {
    const div = document.createElement("div");

    div.innerHTML = `
      <h3>${post.author_username}</h3>
      <p>${post.content}</p>

      <small>${new Date(post.created_at).toLocaleString()}</small>
      <br>

      <strong>Likes: <span class="like-count">${post.like_count}</span></strong>
      <br>

      <button class="like-btn" data-id="${post.id}" data-liked="${post.liked_by_me}">
      ${post.liked_by_me ? "Unlike" : "Like"}
      </button>

      <hr>
    `;

    container.appendChild(div);
  });

  attachLikeHandlers();
}

function toggleLike(postId, liked) {
  const method = liked ? "DELETE" : "POST";
  const url = liked
    ? `/api/posts/${postId}/unlike/`
    : `/api/posts/${postId}/like/`;

  fetch(url, {
    method,
    credentials: "same-origin"
  })
    .then(() => location.reload())
    .catch(err => console.log(err));
}


function attachLikeHandlers() {
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const postId = btn.dataset.id;
      const liked = btn.dataset.liked === "true";

      const method = liked ? "DELETE" : "POST";
      const url = liked
        ? `/api/posts/${postId}/unlike/`
        : `/api/posts/${postId}/like/`;

      fetch(url, {
        method,
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        // ⭐ LIVE UI UPDATE STARTS HERE

        let countEl = btn.parentElement.querySelector(".like-count");

        let currentCount = parseInt(countEl.innerText);

        if (liked) {
          currentCount -= 1;
          btn.innerText = "Like";
          btn.dataset.liked = "false";
        } else {
          currentCount += 1;
          btn.innerText = "Unlike";
          btn.dataset.liked = "true";
        }

        countEl.innerText = currentCount;
      })
      .catch(err => console.log(err));
    });
  });
}

function getCSRFToken() {
  return document.cookie
    .split("; ")
    .find(row => row.startsWith("csrftoken="))
    ?.split("=")[1];
}

</script>
</body>
</html>
