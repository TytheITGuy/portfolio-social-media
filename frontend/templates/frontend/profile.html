<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>

<h1 id="username"></h1>
<p id="bio"></p>

<h2>Create Post</h2>
<textarea id="post-content" rows="3" cols="40"></textarea>
<br>
<button id="create-post-btn">Post</button>
<hr>

<div id="posts">
    <h2>Posts</h2>
    <div id="posts-container"></div>
</div>

<script>
const username = "{{ username }}";

function getCSRFToken() {
  return document.cookie
    .split("; ")
    .find(row => row.startsWith("csrftoken="))
    ?.split("=")[1];
}

fetch(`/api/profiles/${username}/`)
.then(res => res.json())
.then(data => {
    document.getElementById("username").innerText = data.username;
    document.getElementById("bio").innerText = data.bio;
    loadPosts(data.username);
});

function loadPosts(username) {
  fetch(`/api/posts/?username=${username}`, {
    credentials: "same-origin"
  })
  .then(res => res.json())
  .then(data => renderPosts(data.results));
}

function renderPosts(posts) {
  const container = document.getElementById("posts-container");
  container.innerHTML = "";

  posts.forEach(post => {
    const div = document.createElement("div");

    div.innerHTML = `
      <h3>${post.author_username}</h3>
      <p>${post.content}</p>
      <small>${new Date(post.created_at).toLocaleString()}</small><br>
      <strong>Likes: <span class="like-count">${post.like_count}</span></strong><br>
      <button class="like-btn" data-id="${post.id}" data-liked="${post.liked_by_me}">
        ${post.liked_by_me ? "Unlike" : "Like"}
      </button>
      <hr>
    `;

    container.appendChild(div);
  });

  attachLikeHandlers();
}

function attachLikeHandlers() {
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const postId = btn.dataset.id;
      const liked = btn.dataset.liked === "true";

      const method = liked ? "DELETE" : "POST";
      const url = liked
        ? `/api/posts/${postId}/unlike/`
        : `/api/posts/${postId}/like/`;

      fetch(url, {
        method,
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        let countEl = btn.parentElement.querySelector(".like-count");
        let count = parseInt(countEl.innerText);

        if (liked) {
          count--;
          btn.innerText = "Like";
          btn.dataset.liked = "false";
        } else {
          count++;
          btn.innerText = "Unlike";
          btn.dataset.liked = "true";
        }

        countEl.innerText = count;
      });
    });
  });
}

function createPost() {
  const content = document.getElementById("post-content").value;

  fetch("/api/posts/", {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCSRFToken()
    },
    body: JSON.stringify({ content })
  })
  .then(res => res.json())
  .then(() => {
    document.getElementById("post-content").value = "";
    loadPosts(username);
  });
}

document.getElementById("create-post-btn")
  .addEventListener("click", createPost);

</script>

</body>
</html>
