{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <style>
    body {
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
    }

.navbar {
  background: #222;
  padding: 14px 40px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
}

.logo {
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 40px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.nav-links a:hover {
  text-decoration: underline;
}

    .container {
      width: 600px;
      margin: 40px auto;
    }

    .profile-card,
    .post-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
    </style>
</head>

<body>

<div class="navbar">

  <div class="logo">
    <strong>SocialApp</strong>
  </div>

  <div class="nav-links">
    <a href="/feed/">Feed</a>
    <a href="/profile/{{ username }}/">Profile</a>
    <a href="/logout/">Logout</a>
  </div>

</div>

<div class="container">

  <div class="profile-card">
    <h1 id="username"></h1>
    <p id="bio"></p>
  </div>

  <div class="profile-card">
    <h2>Create Post</h2>

    <textarea id="post-content" rows="3"></textarea>

    <br><br>

    <button id="create-post-btn">Post</button>
  </div>

  <h2>Posts</h2>

  <div id="posts-container"></div>

</div>

<script src="{% static 'js/main.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

let CURRENT_USER_ID = null;
const username = "{{ username }}";

fetch("/api/me/", {
  credentials: "same-origin"
})
.then(res => res.json())
.then(user => {

  CURRENT_USER_ID = user.id;

  return fetch(`/api/profiles/${username}/`);

})
.then(res => res.json())
.then(data => {

  document.getElementById("username").innerText = data.username;
  document.getElementById("bio").innerText = data.bio;

  loadPosts(data.username);

});

function loadPosts(username) {

  fetch(`/api/posts/?username=${username}`, {
    credentials: "same-origin"
  })
  .then(res => res.json())
  .then(data => {

    renderPosts(data.results, true);

  });

}

document.getElementById("create-post-btn")
.addEventListener("click", async () => {

  const content =
    document.getElementById("post-content").value;

  if (!content.trim()) return;

  const response = await fetch("/api/posts/", {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCSRFToken()
    },
    body: JSON.stringify({ content })
  });

  const newPost = await response.json();

  addPostToTop({
    ...newPost,
    like_count: 0,
    liked_by_me: false
  });

  document.getElementById("post-content").value = "";

});

});
</script>

</body>
</html>
