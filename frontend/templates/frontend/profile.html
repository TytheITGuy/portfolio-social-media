<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>

<h1 id="username"></h1>
<p id="bio"></p>

<h2>Create Post</h2>
<textarea id="post-content" rows="3" cols="40"></textarea>
<br>
<button id="create-post-btn">Post</button>
<hr>

<div id="posts">
    <h2>Posts</h2>
    <div id="posts-container"></div>
</div>

<script>
const username = "{{ username }}";

function getCSRFToken() {
  return document.cookie
    .split("; ")
    .find(row => row.startsWith("csrftoken="))
    ?.split("=")[1];
}

fetch(`/api/profiles/${username}/`)
.then(res => res.json())
.then(data => {
    document.getElementById("username").innerText = data.username;
    document.getElementById("bio").innerText = data.bio;
    loadPosts(data.username);
});

function loadPosts(username) {
  fetch(`/api/posts/?username=${username}`, {
    credentials: "same-origin"
  })
  .then(res => res.json())
  .then(data => renderPosts(data.results));
}

function renderPosts(posts) {
  const container = document.getElementById("posts-container");
  container.innerHTML = "";

  posts.forEach(post => {
    const div = document.createElement("div");

  div.innerHTML = `
    <h3>${post.author_username}</h3>
    <p>${post.content}</p>
    <small>${new Date(post.created_at).toLocaleString()}</small><br>

    <strong>Likes: <span class="like-count">${post.like_count}</span></strong><br>

   <button class="like-btn" data-id="${post.id}" data-liked="${post.liked_by_me}">
      ${post.liked_by_me ? "Unlike" : "Like"}
    </button>

    <br><br>
    <button class="edit-btn" data-id="${post.id}">Edit</button>
    <button class="delete-btn" data-id="${post.id}">Delete</button>

    <hr>
`;

    container.appendChild(div);
  });

  attachLikeHandlers();
  attachDeleteHandlers();
  attachEditHandlers();
}

function attachLikeHandlers() {
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const postId = btn.dataset.id;
      const liked = btn.dataset.liked === "true";

      const method = liked ? "DELETE" : "POST";
      const url = liked
        ? `/api/posts/${postId}/unlike/`
        : `/api/posts/${postId}/like/`;

      fetch(url, {
        method,
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        let countEl = btn.parentElement.querySelector(".like-count");
        let count = parseInt(countEl.innerText);

        if (liked) {
          count--;
          btn.innerText = "Like";
          btn.dataset.liked = "false";
        } else {
          count++;
          btn.innerText = "Unlike";
          btn.dataset.liked = "true";
        }

        countEl.innerText = count;
      });
    });
  });
}


document.getElementById("create-post-btn")
  .addEventListener("click", createPost);


function getCSRFToken() {
  return document.cookie
    .split("; ")
    .find(row => row.startsWith("csrftoken="))
    ?.split("=")[1];
}

document.getElementById('create-post-btn')
  .addEventListener('click', async () => {

    const content = document.getElementById('post-content').value;

    if (!content.trim()) return;

    try {
      const response = await fetch('/api/posts/', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ content })
      });

      const newPost = await response.json();

      addPostToTop(newPost); // 👈 THIS updates UI instantly

      document.getElementById('post-content').value = '';

    } catch (err) {
      console.error(err);
    }
});

function addPostToTop(post) {
  const container = document.getElementById('posts-container');

  const div = document.createElement("div");
  div.classList.add("post");

  div.innerHTML = `
    <strong>${post.author_username}</strong><br>
    <p>${post.content}</p>
    <small>${new Date(post.created_at).toLocaleString()}</small>
    <br>

    <strong>Likes: <span class="like-count">0</span></strong>
    <br><br>

    <button class="like-btn" data-id="${post.id}" data-liked="false">
      Like
    </button>

    <br><br>
    <button class="edit-btn" data-id="${post.id}">Edit</button>
    <button class="delete-btn" data-id="${post.id}">Delete</button>
  `;

  container.prepend(div);


  attachLikeHandlers();
  attachDeleteHandlers();
  attachEditHandlers();
}

function attachDeleteHandlers() {
  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", () => {

      const postId = btn.dataset.id;

      fetch(`/api/posts/${postId}/`, {
        method: "DELETE",
        credentials: "same-origin",
        headers: {
          "X-CSRFToken": getCSRFToken()
        }
      })
      .then(() => {
        btn.closest("div").remove();
      });

    });
  });
}

function attachEditHandlers() {
  document.querySelectorAll(".edit-btn").forEach(btn => {

    btn.addEventListener("click", () => {

      const card = btn.closest("div");
      const contentEl = card.querySelector("p");

      const originalText = contentEl.innerText;

      contentEl.innerHTML = `
        <textarea class="edit-area">${originalText}</textarea>
        <br>
        <button class="save-btn">Save</button>
      `;

      btn.style.display = "none";

      card.querySelector(".save-btn")
        .addEventListener("click", () => {

          const newContent =
            card.querySelector(".edit-area").value;

          const postId = btn.dataset.id;

          fetch(`/api/posts/${postId}/`, {
            method: "PATCH",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({ content: newContent })
          })
          .then(res => res.json())
          .then(updated => {

            contentEl.innerHTML = updated.content;
            btn.style.display = "inline";

          });

        });

    });

  });
}




</script>




</body>
</html>
